      * {

      #brand-header {

      }

      #overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000000;

        font-size: 32px;
        font-weight: 900;
        letter-spacing: 3px;
        line-height: 1.1;
        margin-bottom: 30px;
        text-transform: uppercase;
      }

      .red-accent {
        color: #E50000;
      }

        letter-spacing: 2px;
        text-transform: uppercase;

        color: #FFFFFF;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        box-shadow: 0 0 25px rgba(229, 0, 0, 0.45);
        transition: all 0.2s ease;
      }

      #btn-start:active {
        background-color: #B30000;
        transform: scale(0.98);
      }
