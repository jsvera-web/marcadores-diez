<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      #overlay {
        position: absolute; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.85);
      }
      #btn {
        padding: 18px 36px; font-size: 18px; background: #00E5FF; color: #111; 
        border: none; border-radius: 50px; cursor: pointer; font-weight: bold; font-family: sans-serif;
        box-shadow: 0 0 15px rgba(0, 229, 255, 0.6);
      }
      /* Botón para activar o silenciar audio */
      #mute-btn {
        position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
        z-index: 999; padding: 12px 24px; font-size: 14px; background: rgba(0, 0, 0, 0.7);
        color: #fff; border: 2px solid #00E5FF; border-radius: 30px; cursor: pointer;
        font-family: sans-serif; display: none;
      }
    </style>
  </head>
  <body>
    <!-- Pantalla de bienvenida -->
    <div id="overlay">
      <button id="btn">ACTIVAR CÁMARA AR</button>
    </div>

    <!-- Botón de sonido flotante -->
    <button id="mute-btn">🔊 ACTIVAR SONIDO</button>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
             
      <a-assets timeout="10000">
        <!-- 'muted' es OBLIGATORIO para que Safari y Chrome permitan reproducir en AR -->
        <video id="mi-video" 
               src="./video.mp4" 
               preload="auto" 
               loop 
               muted 
               autoplay 
               playsinline 
               webkit-playsinline 
               crossorigin="anonymous">
        </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0" id="objetivo">
        <!-- Plano vertical 9:16 -->
        <a-video src="#mi-video" 
                 position="0 0 0" 
                 width="1" 
                 height="1.778" 
                 rotation="0 0 0">
        </a-video>
      </a-entity>
    </a-scene>

    <script>
      const btn = document.querySelector("#btn");
      const overlay = document.querySelector("#overlay");
      const muteBtn = document.querySelector("#mute-btn");
      const video = document.querySelector("#mi-video");
      const target = document.querySelector("#objetivo");

      btn.addEventListener('click', () => {
        overlay.style.display = "none";
        muteBtn.style.display = "block";

        // Iniciamos la reproducción silenciada (permitida por todos los navegadores)
        video.play().catch(err => console.log("Esperando objetivo para reproducir...", err));
      });

      // Alternar sonido con el botón flotante
      muteBtn.addEventListener('click', () => {
        video.muted = !video.muted;
        muteBtn.textContent = video.muted ? "🔊 ACTIVAR SONIDO" : "🔇 SILENCIAR";
      });

      // Control al enfocar el marcador
      target.addEventListener("targetFound", () => {
        console.log("Objetivo encontrado");
        video.play().catch(err => console.error("Error al reproducir video:", err));
      });

      target.addEventListener("targetLost", () => {
        console.log("Objetivo perdido");
        video.pause();
      });
    </script>
  </body>
</html>
