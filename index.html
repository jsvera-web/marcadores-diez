<!DOCTYPE html>
<html lang="es">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DIEZ CERO UNO ≠</title>
    <!-- Librerías de A-Frame y MindAR -->
    <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body { 
        margin: 0; 
        overflow: hidden; 
      }

      /* LOGO FIJO PERMANENTE EN LA ESQUINA SUPERIOR IZQUIERDA */
      #brand-header {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 1001;
        pointer-events: none;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #brand-header img {
        height: 32px;
        width: auto;
      }
      .brand-title-text {
        color: #FFFFFF;
        font-size: 14px;
        font-weight: 900;
        letter-spacing: 2px;
        font-family: sans-serif;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
      }
      .brand-red-sym {
        color: #E50000;
        font-weight: 900;
      }

      /* PANTALLA INICIAL TRASLÚCIDA (LA CÁMARA SE VE DE FONDO) */
      #overlay {
        position: absolute;
        z-index: 1000;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.45);
      }

      /* BOTÓN PRINCIPAL ROJO (EN REEMPLAZO DEL CELESTE) */
      #btn {
        padding: 18px 36px;
        font-size: 16px;
        background: #E50000;
        color: #FFFFFF; 
        border: 2px solid #FFFFFF;
        border-radius: 50px;
        cursor: pointer;
        font-weight: 900;
        font-family: sans-serif;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        box-shadow: 0 0 20px rgba(229, 0, 0, 0.7);
      }
      #btn:active {
        background: #B30000;
        transform: scale(0.96);
      }

      /* BOTÓN DE AUDIO FLOTANTE (NEGRO Y ROJO) */
      #btn-sound {
        position: absolute;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999;
        padding: 12px 26px;
        font-size: 14px;
        background: rgba(0, 0, 0, 0.85);
        color: #FFFFFF;
        border: 2px solid #E50000;
        border-radius: 30px;
        cursor: pointer;
        font-weight: 800;
        font-family: sans-serif;
        display: none;
        box-shadow: 0 0 15px rgba(229, 0, 0, 0.5);
      }

      /* LA LÍNEA DEL ESCÁNER DE MINDAR EN COLOR ROJO */
      .mindar-ui-scanning .scanning .line {
        background: #E50000 !important;
        box-shadow: 0 0 10px #E50000 !important;
      }
    </style>
  </head>
  <body>

    <!-- LOGO FIJO EN LA ESQUINA SUPERIOR IZQUIERDA -->
    <div id="brand-header">
      <img src="./logo.png" alt="Logo" onerror="this.style.display='none'" />
      <span class="brand-title-text">DIEZ CERO UNO <span class="brand-red-sym">≠</span></span>
    </div>

    <!-- BOTÓN INICIAL -->
    <div id="overlay">
      <button id="btn">ACTIVAR CÁMARA AR</button>
    </div>

    <!-- BOTÓN DE AUDIO FLOTANTE -->
    <button id="btn-sound">🔊 ACTIVAR AUDIO</button>

    <!-- ESCENA AR (CON SU CUADRO Y LÍNEA DE ESCANEO ORIGINAL) -->
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets timeout="10000">
        <video
          id="video-ar"
          src="./video.mp4"
          preload="auto"
          loop
          crossorigin="anonymous"
          playsinline
          webkit-playsinline
          muted>
        </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- MARCADOR CON VIDEO VERTICAL -->
      <a-entity mindar-image-target="targetIndex: 0" id="objetivo">
        <a-video
          src="#video-ar"
          width="1"
          height="1.78"
          position="0 0 0"
          rotation="0 0 0"
          material="shader: flat;">
        </a-video>
      </a-entity>
    </a-scene>

    <script>
      const btn = document.querySelector("#btn");
      const overlay = document.querySelector("#overlay");
      const video = document.querySelector("#video-ar");
      const target = document.querySelector("#objetivo");
      const btnSound = document.querySelector("#btn-sound");

      // 1. Al presionar el botón inicial
      btn.addEventListener("click", () => {
        overlay.style.display = "none";
        video.play().then(() => {
          video.pause();
        }).catch(err => {
          console.log("Video en espera:", err);
        });
      });

      // 2. Al detectar el marcador físico
      target.addEventListener("targetFound", () => {
        video.play().then(() => {
          if (video.muted) {
            btnSound.style.display = "block";
          }
        }).catch(() => {
          video.muted = true;
          video.play();
          btnSound.style.display = "block";
        });
      });

      // 3. Al perder el marcador
      target.addEventListener("targetLost", () => {
        video.pause();
        btnSound.style.display = "none";
      });

      // 4. Activar o desactivar sonido
      btnSound.addEventListener("click", () => {
        if (video.muted) {
          video.muted = false;
          btnSound.textContent = "🔇 SILENCIAR AUDIO";
        } else {
          video.muted = true;
          btnSound.textContent = "🔊 ACTIVAR AUDIO";
        }
      });
    </script>
  </body>
</html>
