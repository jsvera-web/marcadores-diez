<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      #overlay {
        position: absolute; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.85);
      }
      #btn {
        padding: 18px 36px; font-size: 18px; background: #00E5FF; color: #111; 
        border: none; border-radius: 50px; cursor: pointer; font-weight: bold; font-family: sans-serif;
        box-shadow: 0 0 15px rgba(0, 229, 255, 0.6);
      }
    </style>
  </head>
  <body>
    <!-- Botón inicial para activar cámara -->
    <div id="overlay">
      <button id="btn">ACTIVAR CÁMARA AR</button>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0" id="objetivo">
        <!-- PLANO DE AVANCE (Cuadrado con marco y texto que sigue al rastreador) -->
        <a-plane position="0 0 0" width="1" height="1" color="#121212" material="opacity: 0.92; transparent: true">
          <a-ring radius-inner="0.48" radius-outer="0.5" position="0 0 0.01" color="#00E5FF"></a-ring>
          <a-text value="RASTREO ACTIVO\n\n[Espacio reservado\npara el video]" 
                  align="center" 
                  position="0 0 0.02" 
                  width="1.8" 
                  color="#FFFFFF">
          </a-text>
        </a-plane>
      </a-entity>
    </a-scene>

    <script>
      const btn = document.querySelector("#btn");
      const overlay = document.querySelector("#overlay");

      btn.addEventListener('click', () => {
        overlay.style.display = "none";
      });

      const target = document.querySelector("#objetivo");
      target.addEventListener("targetFound", () => {
        console.log("Objetivo detectado");
      });
    </script>
  </body>
</html>
