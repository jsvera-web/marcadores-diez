<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      #overlay {
        position: absolute; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.85);
      }
      #btn {
        padding: 18px 36px; font-size: 18px; background: #00E5FF; color: #111; 
        border: none; border-radius: 50px; cursor: pointer; font-weight: bold; font-family: sans-serif;
        box-shadow: 0 0 15px rgba(0, 229, 255, 0.6);
      }
    </style>
  </head>
  <body>
    <!-- Botón inicial para activar cámara y habilitar reproducción -->
    <div id="overlay">
      <button id="btn">ACTIVAR CÁMARA AR</button>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <!-- Tu archivo de video vertical (9:16) -->
        <video id="mi-video" 
               src="./video.mp4" 
               preload="auto" 
               loop 
               crossorigin="anonymous" 
               playsinline 
               webkit-playsinline>
        </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0" id="objetivo">
        <!-- PLANO DE VIDEO EN FORMATO VERTICAL (9:16) -->
        <a-video src="#mi-video" 
                 position="0 0 0" 
                 width="1" 
                 height="1.778" 
                 rotation="0 0 0">
        </a-video>
      </a-entity>
    </a-scene>

    <script>
      const btn = document.querySelector("#btn");
      const overlay = document.querySelector("#overlay");
      const video = document.querySelector("#mi-video");
      const target = document.querySelector("#objetivo");

      btn.addEventListener('click', () => {
        overlay.style.display = "none";
        
        // Habilitar permisos de reproducción para navegadores móviles
        video.play().then(() => {
          video.pause();
        }).catch(err => {
          console.warn("Reproducción en espera del objetivo:", err);
        });
      });

      // Reproducir al enfocar la imagen
      target.addEventListener("targetFound", () => {
        console.log("Objetivo detectado");
        video.play();
      });

      // Pausar si se pierde de vista
      target.addEventListener("targetLost", () => {
        console.log("Objetivo perdido");
        video.pause();
      });
    </script>
  </body>
</html>
